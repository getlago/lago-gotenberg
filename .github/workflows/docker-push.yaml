name: Build and Push to GHCR

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build Gotenberg Image
    uses: getlago/lago/.github/workflows/docker-build-multi-arch.yaml@main
    with:
      # Publish under the repo's own package namespace so GHCR links the
      # package back to lago-gotenberg (via the org.opencontainers.image.source
      # label on the Dockerfile), and repo permissions inherit automatically.
      # Previous name (ghcr.io/getlago/gotenberg) will be retired after
      # everything upstream has moved off it.
      image-name: ghcr.io/getlago/lago-gotenberg
      registry: ghcr
